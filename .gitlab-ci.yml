image: node:22

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - backend/node_modules/

stages:
  - build
  - lint
  - test

build:
  stage: build
  script:
    - cd backend
    - npm install --legacy-peer-deps
  artifacts:
    expire_in: 1 hour
    paths:
      - backend/node_modules/

lint:
  stage: lint
  script:
    - cd backend
    - npx eslint ./ --fix || true
  allow_failure: true

test_backend:
  stage: test
  variables:
    REDIS_URL: redis://redis:6379
  services:
    - name: redis:latest
  script:
    - cd backend
    - npm test
  timeout: 5m

backend_npm_audit:
  stage: test
  script:
    - cd backend
    - npm audit || true
  timeout: 5m
  artifacts:
    when: always
    paths:
      - backend/backend_npm_audit.log
    expire_in: 1 days
